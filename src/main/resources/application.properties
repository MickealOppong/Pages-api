# This file is safe to push to GitHub because it contains no real passwords
# standard Spring Boot configuration

server.port=${PORT:8080}

# Database Configurations
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Explicitly tell Hibernate to use MySQL 8+ syntax
//spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=false

spring.servlet.multipart.enabled=true

rsa.private-key=classpath:certs/private.pem
rsa.public-key=classpath:certs/public.pem

# Tell Spring Security where your public key is located
#spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:certs/public.pem

# The maximum size allowed for a single uploaded file
spring.servlet.multipart.max-file-size=30MB

# The maximum size allowed for the whole request (file + text data)
spring.servlet.multipart.max-request-size=30MB
# Default session timeout (in seconds)
#server.servlet.session.timeout=600

# Enable JDBC session (if using JDBC)
#spring.session.store-type=jdbc

# Enable Redis session (if using Redis)
# spring.session.store-type=redis
