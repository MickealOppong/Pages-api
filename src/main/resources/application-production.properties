spring.application.name=app
spring.profiles.active=production

# =========================
# Server
# =========================

server.port=${PORT:8080}


# =========================
# MySQL / Railway
# =========================

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================
# JPA / Hibernate
# =========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false


# =========================
# Hikari Connection Pool
# =========================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000


# =========================
# File Uploads
# =========================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB


# =========================
# JWT / RSA
# =========================

rsa.private-key=classpath:certs/private.pem
rsa.public-key=classpath:certs/public.pem

# spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:certs/public.pem


